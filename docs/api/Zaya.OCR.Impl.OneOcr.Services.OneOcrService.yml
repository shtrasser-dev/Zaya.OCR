  assemblies:
  - Zaya.OCR.Impl.OneOcr
  namespace: Zaya.OCR.Impl.OneOcr.Services
  summary: >-
    OneOCR engine implementation of <xref href="Zaya.OCR.Services.IOCRService" data-throw-if-not-resolved="false"></xref> using P/Invoke

    into the native <code>oneocr.dll</code> (Windows 11 SnippingTool OCR engine).

    No WinRT, no Windows App SDK, no package identity required.

    Pass engine settings directly to <xref href="Zaya.OCR.Impl.OneOcr.Services.OneOcrService.CreateSessionAsync(System.Collections.Generic.IReadOnlyDictionary%7bSystem.String%2cSystem.Object%7d%2cSystem.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>

    <xref href="Zaya.OCR.Impl.OneOcr.Services.OneOcrService.EngineId" data-throw-if-not-resolved="false"></xref> is <code>oneocr</code>.

    Settings are exposed via <xref href="Zaya.OCR.Impl.OneOcr.Services.OneOcrService.Settings" data-throw-if-not-resolved="false"></xref> as <xref href="Zaya.Primitives.SettingDescriptor" data-throw-if-not-resolved="false"></xref> instances

    for UI hosts, and accepted as a string-keyed dictionary by

    <xref href="Zaya.OCR.Impl.OneOcr.Services.OneOcrService.CreateSessionAsync(System.Collections.Generic.IReadOnlyDictionary%7bSystem.String%2cSystem.Object%7d%2cSystem.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref>.

    Use <xref href="Zaya.OCR.Impl.OneOcr.OneOcrConfig" data-throw-if-not-resolved="false"></xref> for a typed alternative.

    </p>

    <p><b>Setting keys</b></p>

    <table><thead><tr><th class="term">Key</th><th class="term">Type</th><th class="term">Default</th><th class="term">Description</th></tr></thead><tbody><tr><td class="term"><code>source</code></td><td class="term">enum string</td><td class="term"><code>auto</code></td><td class="term">

    Where to load engine files from.

    Values: <code>auto</code> (SnippingTool, then URL fallback),

    <code>snippingtool</code>, <code>directory</code>, <code>url</code>.

    </td></tr><tr><td class="term"><code>directoryPath</code></td><td class="term">directory path</td><td class="term">(none)</td><td class="term">

    Local folder with <code>oneocr.dll</code>, <code>onnxruntime.dll</code>, and <code>oneocr.onemodel</code>.

    Required when <code>source</code> is <code>directory</code>.

    </td></tr><tr><td class="term"><code>downloadUrl</code></td><td class="term">URL</td><td class="term">GitHub <code>Zaya.External</code> OneOCR.zip release</td><td class="term">

    Package URL used when <code>source</code> is <code>url</code>,

    and as fallback when <code>source</code> is <code>auto</code>.

    </td></tr><tr><td class="term"><code>cacheDirectory</code></td><td class="term">directory path</td><td class="term"><code>%TEMP%\Zaya\OneOcr</code></td><td class="term">

    Writable cache for copied/extracted engine files

    (<code>auto</code>, <code>snippingtool</code>, <code>url</code>).

    Hosts such as ScreenTranslator may override this key.

    </td></tr><tr><td class="term"><code>minConfidence</code></td><td class="term">integer 0–100</td><td class="term"><code>0</code></td><td class="term">Minimum word confidence (percent). Words below the threshold are dropped.</td></tr></tbody></table>

    <p>

    Example:

    </p>

    <pre><code class="lang-csharp">using var ocr = new OneOcrService();

    using var session = await ocr.CreateSessionAsync(new Dictionary&lt;string, object&gt;

    {
        ["source"] = "auto",
        ["minConfidence"] = 50,
    });

    var result = await session.RecognizeAsync(image);</code></pre>
