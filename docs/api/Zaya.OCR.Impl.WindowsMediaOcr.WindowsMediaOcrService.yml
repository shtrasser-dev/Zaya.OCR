  assemblies:
  - Zaya.OCR.Impl.WindowsMediaOcr
  namespace: Zaya.OCR.Impl.WindowsMediaOcr
  summary: >-
    Windows.Media.Ocr implementation of <xref href="Zaya.OCR.Services.IOCRService" data-throw-if-not-resolved="false"></xref>.

    Uses the official WinRT OCR API available on Windows 10+.
  remarks: >-
    <p>

    <xref href="Zaya.OCR.Impl.WindowsMediaOcr.WindowsMediaOcrService.EngineId" data-throw-if-not-resolved="false"></xref> is <code>windows-media-ocr</code>.

    Desktop apps typically require <b>package identity</b> (MSIX) to call this API.

    Install OCR language packs in Windows Settings if recognition languages are missing.

    </p>

    <p><b>Setting keys</b></p>

    <table><thead><tr><th class="term">Key</th><th class="term">Type</th><th class="term">Default</th><th class="term">Description</th></tr></thead><tbody><tr><td class="term"><code>language</code></td><td class="term">enum string</td><td class="term"><code>auto</code></td><td class="term">

    <code>auto</code> uses <code>OcrEngine.TryCreateFromUserProfileLanguages</code>;

    otherwise a BCP-47 tag passed to <code>TryCreateFromLanguage</code>.

    Options include installed OCR languages when available, else <xref href="Zaya.Primitives.Languages.All" data-throw-if-not-resolved="false"></xref>.

    </td></tr></tbody></table>

    <p>

    Example:

    </p>

    <pre><code class="lang-csharp">using var ocr = new WindowsMediaOcrService();

    using var session = await ocr.CreateSessionAsync(new Dictionary&lt;string, object&gt;

    {
        ["language"] = "en",
    });

    var result = await session.RecognizeAsync(image);</code></pre>
  example: []
  syntax:
    content: 'public sealed class WindowsMediaOcrService : IOCRService, IDisposable'
    content.vb: Public NotInheritable Class WindowsMediaOcrService Implements IOCRService, IDisposable
