    startLine: 19
  assemblies:
  - Zaya.OCR
  namespace: Zaya.OCR.Models
  summary: >-
    Oriented quadrilateral in image pixel space (Y down).

    Corner order matches OneOCR: P1→P2 along the top (reading direction), P3→P4 along the bottom back.
  remarks: >-
    <p>

    <code>P1 ----→ P2</code><br />

    <code>↑         ↓</code><br />

    <code>P4 ←---- P3</code>

    </p>

    <p>

    <xref href="Zaya.OCR.Models.BoundingBox.Direction" data-throw-if-not-resolved="false"></xref> and <xref href="Zaya.OCR.Models.BoundingBox.AngleDegrees" data-throw-if-not-resolved="false"></xref> are derived from the average of

    the top edge (P2−P1) and bottom edge (P3−P4).

    </p>
  example: []
  syntax:
    content: 'public readonly struct BoundingBox : IEquatable<BoundingBox>'
    content.vb: Public Structure BoundingBox Implements IEquatable(Of BoundingBox)
